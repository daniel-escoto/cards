name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Multiplayer smoke test
        env:
          PORT: 3000
          SMOKE_URL: http://localhost:3000
          GAME_STATE_FILE: ${{ runner.temp }}/cards-smoke-rooms.json
        run: |
          node server.js > "$RUNNER_TEMP/cards-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent "$SMOKE_URL/" > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent "$SMOKE_URL/" > /dev/null
          npm run smoke
      - name: Server log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/cards-server.log" 2>/dev/null || true
